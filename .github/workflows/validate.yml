# PR build validation

name: Validate

on:
  # Runs on the pull request's own code. (`pull_request_target` would check out the base branch
  # instead, so it would never build what the PR changes.)
  # Pull requests from branches in this repository can use the READ_PACKAGES_TOKEN secret to fetch
  # the Revenge API dependency. Pull requests from forks can't, so their build can't download it.
  # Keep that token limited to reading packages only.
  pull_request:
    paths:
      - 'plugins/**'
      - 'cli/**'
      - '.github/**'
      - 'repo.config.json'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Lint the workflow scripts
        run: shellcheck .github/scripts/*.sh

      - name: Build all plugins
        run: ./gradlew --no-daemon packageAllPlugins
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }} # For Gradle to download the API dependency.

      - name: Generate index from built artifacts
        run: |
          bun run generate-index \
            --dist build/dist \
            --base-url https://revenge.local \
            --out /tmp/index.json
          cat /tmp/index.json
